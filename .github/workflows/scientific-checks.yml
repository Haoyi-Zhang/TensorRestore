name: Finite scientific checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owned-finite-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      README_ENTRY: 'README.md'
      MIN_EXPECTED_PYTHON_SOURCES: '18'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run owned finite evidence and retained fail gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scientific-output
          # Per-process limits are inherited by children; the timeout bounds the
          # entire command sequence. Neither CPU nor address space is a tree sum.
          ulimit -v 3145728
          ulimit -t 240
          timeout --signal=TERM --kill-after=5s 360s bash -euo pipefail -c '
            python -B .github/scripts/check_repository.py 2>&1 | tee scientific-output/integrity.log
            python -B run.py --suite all --out scientific-output/results 2>&1 | tee scientific-output/campaign.log
            python -B compare.py results scientific-output/results 2>&1 | tee scientific-output/comparison.log
            python -B -m refcert check scientific-output/results/case-packet-fan-4.json 2>&1 | tee scientific-output/checker.log
            python -B reference_audit.py --out scientific-output/reference-summary.json 2>&1 | tee scientific-output/reference.log
            python -B tables.py --results scientific-output/results --out scientific-output/tables 2>&1 | tee scientific-output/tables.log
          '
      - name: Upload raw outputs even after a failed gate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p041-scientific-output
          path: scientific-output/
          if-no-files-found: error
          retention-days: 14
